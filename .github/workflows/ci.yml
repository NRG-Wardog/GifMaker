name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linked-list-core:
    name: Core linked-list tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core tests with warnings
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -I GifMaker GifMaker/linkedList.c tests/test_linked_list.c -o linked-list-tests

      - name: Run core tests
        run: ./linked-list-tests
