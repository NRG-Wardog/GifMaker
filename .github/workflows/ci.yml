name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linked-list-core:
    name: Core linked-list tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [standard, sanitizers]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject developer-specific build paths
        run: |
          python - <<'PY'
          from pathlib import Path

          checked_suffixes = {".c", ".h", ".vcxproj", ".props", ".targets"}
          forbidden = ("C:\\Users\\", "D:\\Users\\", "printTreeToFile.lib")
          findings = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in checked_suffixes:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for marker in forbidden:
                  if marker in text:
                      findings.append(f"{path}: contains {marker!r}")

          if findings:
              raise SystemExit("Developer-specific build configuration found:\n" + "\n".join(findings))
          PY

      - name: Build core tests
        run: |
          flags="-std=c11 -Wall -Wextra -Wpedantic -Werror"
          if [ "${{ matrix.mode }}" = "sanitizers" ]; then
            flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          gcc $flags -I GifMaker GifMaker/linkedList.c tests/test_linked_list.c -o linked-list-tests

      - name: Run core tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./linked-list-tests
